<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Tiling luminance mask for ProfileCard's holographic shine: the rainbow
       sheen only shows where this is light, so white glyphs on black make the
       code symbols glint as the card tilts. Mirrors the demo's /images/dev.png. -->
  <rect width="240" height="240" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- </> -->
    <polyline points="58,34 34,50 58,66"/>
    <polyline points="82,34 106,50 82,66"/>
    <line x1="76" y1="28" x2="64" y2="72"/>
    <!-- { } -->
    <path d="M176 30c-8 0-8 8-8 12s0 6-6 6c6 0 6 2 6 6s0 12 8 12"/>
    <path d="M200 30c8 0 8 8 8 12s0 6 6 6c-6 0-6 2-6 6s0 12-8 12"/>
    <!-- # -->
    <line x1="50" y1="140" x2="44" y2="182"/>
    <line x1="70" y1="140" x2="64" y2="182"/>
    <line x1="36" y1="153" x2="78" y2="153"/>
    <line x1="34" y1="169" x2="76" y2="169"/>
    <!-- ( ) -->
    <path d="M146 132a28 30 0 0 0 0 44"/>
    <path d="M168 132a28 30 0 0 1 0 44"/>
    <!-- [ ] -->
    <path d="M186 198h-10v36h10"/>
    <path d="M208 198h10v36h-10"/>
    <!-- >_ prompt -->
    <polyline points="38,206 54,219 38,232"/>
    <line x1="62" y1="232" x2="84" y2="232"/>
    <!-- stray slash, breaks up the grid on repeat -->
    <line x1="216" y1="104" x2="204" y2="140"/>
  </g>
  <!-- ; -->
  <circle cx="120" cy="98" r="4.5" fill="#fff"/>
  <path d="M120 112a4.5 4.5 0 1 1 0 9c0 3-2 5-4 6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
